<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Antigravity OpenClaw - Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Open Source Autonomous Remote Agent Studio for Google Antigravity CLI">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦅</text></svg>">
  
  <!-- Themeable Docsify Dark Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #388bfd;
      --theme-color-dark: #1f6feb;
      --sidebar-width: 280px;
      --sidebar-background: #161b22;
      --sidebar-nav-link-color: #c9d1d9;
      --sidebar-nav-link-color--active: #58a6ff;
      --sidebar-name-color: #f0f6fc;
      --content-max-width: 920px;
      --code-inline-background: #21262d;
      --code-inline-color: #79c0ff;
      --code-theme-background: #0d1117;
      --search-input-background-color: #0d1117;
      --search-input-color: #c9d1d9;
      --search-result-heading-color: #58a6ff;
      --table-row-odd-background: #161b22;
      --table-cell-border-color: #30363d;
      --table-head-border-color: #30363d;
    }
    .cover-main h1 {
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .cover-main .anchor span {
      color: #388bfd;
    }
    .markdown-section pre {
      border: 1px solid #30363d;
      border-radius: 8px;
    }
    .sidebar-logo {
      font-size: 24px;
      margin-right: 8px;
    }
    .badge-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(56, 139, 253, 0.15);
      color: #58a6ff;
      border: 1px solid rgba(56, 139, 253, 0.3);
    }
  </style>
</head>
<body>
  <div id="app">Loading Antigravity OpenClaw Documentation...</div>
  <script>
    window.$docsify = {
      name: '🦅 OpenClaw',
      repo: 'https://github.com/chabuuuu/antigravity_open_claw',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      subMaxLevel: 3,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      }
    }
  </script>
  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
