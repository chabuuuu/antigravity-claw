version: '3.8'

services:
  openclaw:
    # Use pre-built GHCR image, or comment out 'image' and uncomment 'build' for local build
    image: ghcr.io/chabuuuu/antigravity-claw:latest
    build: .
    container_name: antigravity_openclaw
    restart: unless-stopped
    ports:
      - "${OPENCLAW_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backend:/app/backend:ro
      - ./static:/app/static:ro
      # Mount user's Gemini config & OAuth credentials with read-write access
      - ~/.gemini:/root/.gemini:rw
      - ~/.config/antigravity:/root/.config/antigravity:rw
      # Mount host workspace
      - ${HOST_WORKSPACE:-./workspace}:/workspace
      # Optional: Mount docker socket if using docker-based MCP tool servers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - OPENCLAW_HOST=0.0.0.0
      - OPENCLAW_PORT=8080
      - OPENCLAW_WORKSPACE=/workspace
      - AGY_BIN_PATH=/root/.gemini/bin/agy


