version: '3.8'

services:
  openclaw:
    # Use pre-built GHCR image, or comment out 'image' and uncomment 'build' for local build
    image: ghcr.io/${GHCR_REPO:-google-antigravity/antigravity-openclaw}:latest
    # build: .
    container_name: antigravity_openclaw
    restart: unless-stopped
    ports:
      - "${OPENCLAW_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount user's Gemini config so container can reach Antigravity credentials and CLI
      - ~/.gemini:/root/.gemini:ro
      # Mount host workspace
      - ${HOST_WORKSPACE:-./workspace}:/workspace
    environment:
      - OPENCLAW_HOST=0.0.0.0
      - OPENCLAW_PORT=8080
      - OPENCLAW_WORKSPACE=/workspace
      - AGY_BIN_PATH=/root/.gemini/bin/agy


