version: '3.8'

services:
  openclaw:
    build: .
    container_name: antigravity_openclaw
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount user's Gemini config so container can reach Antigravity settings and tokens
      - ~/.gemini:/root/.gemini:ro
      # Mount host workspace
      - ${HOST_WORKSPACE:-./workspace}:/workspace
    environment:
      - OPENCLAW_HOST=0.0.0.0
      - OPENCLAW_PORT=8080
      - OPENCLAW_WORKSPACE=/workspace
      - AGY_BIN_PATH=/root/.gemini/bin/agy
